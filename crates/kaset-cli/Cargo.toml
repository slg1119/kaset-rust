[package]
name = "kaset-cli"
version = "0.1.0"
description = "Command-line client for Kaset"
edition.workspace = true
license.workspace = true
default-run = "kaset"

[[bin]]
name = "kaset"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
kaset-session = { path = "../kaset-session" }
kaset-ipc = { path = "../kaset-ipc" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
ytm-core = { path = "../ytm-core" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
kaset-session = { path = "../kaset-session", features = ["test-support"] }
