[package]
name = "kaset"
version = "0.1.0"
description = "Kaset, a YouTube Music desktop client"
edition.workspace = true
license.workspace = true
default-run = "kaset-desktop"

# Keep the desktop artifact distinct from the standalone kaset CLI.
[[bin]]
name = "kaset-desktop"
path = "src/main.rs"

[lib]
name = "kaset_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
kaset-session = { path = "../../crates/kaset-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.9.3"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-notification = "=2.8.1"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
window-vibrancy = "0.8.1"
ytm-core = { version = "0.1.0", path = "../../crates/ytm-core", features = ["specta"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media", "Win32_Foundation", "Win32_System_WinRT"] }

[dev-dependencies]
kaset-session = { path = "../../crates/kaset-session", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
