name: Tauri Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: dmg
            asset: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: nsis
            asset: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Configure release version
        env:
          KASET_WINDOWS_SIGN_COMMAND: ${{ vars.KASET_WINDOWS_SIGN_COMMAND }}
        run: |
          node --input-type=module <<'JS'
          import { join } from 'node:path';
          import { writeFileSync } from 'node:fs';
          const version = process.env.GITHUB_REF_NAME.slice(1);
          const config = { version };
          const signCommand = process.env.KASET_WINDOWS_SIGN_COMMAND;
          if (process.platform === 'win32' && signCommand) {
            config.bundle = { windows: { signCommand } };
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'kaset-release.json'), JSON.stringify(config));
          JS
      - name: Build universal macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY=-
          else
            : "${APPLE_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PWD is required for signing}"
            : "${APPLE_ID:?APPLE_ID is required for notarization}"
            : "${APPLE_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD is required for notarization}"
            : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required for notarization}"
          fi
          pnpm tauri build --ci --target universal-apple-darwin --bundles dmg --config "$RUNNER_TEMP/kaset-release.json" -- --locked
      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis --config "$RUNNER_TEMP/kaset-release.json" -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: kaset-${{ matrix.bundle }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kaset-*
          merge-multiple: true
          path: installers
      - name: Publish both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(installers/*.dmg installers/*-setup.exe)
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes "${flags[@]}"
          fi
